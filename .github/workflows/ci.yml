name: CI

# Continuous integration: install + test on every push and PR to main.
# This workflow NEVER publishes and NEVER requests id-token. The release path
# lives entirely in release.yml, gated on a tag push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. CI only reads the repo; no write scopes, no OIDC.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    # Pinned, not `ubuntu-latest`. actions/python-versions ships no Python
    # 3.9 build for ubuntu-26.04, and 3.9 is this package's declared floor
    # (`requires-python = ">=3.9"`). `ubuntu-latest` resolves to 24.04 today,
    # but when it rolls to 26.04 the 3.9 leg of this matrix stops resolving and
    # the release gate breaks on a runner-image change nobody made. Verified
    # against the manifest: 3.9.25 has 22.04 and 24.04 builds and no 26.04 one.
    # Raise this deliberately when the support floor is raised.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject `requires-python = ">=3.9"`. 3.9 is the declared
        # floor; 3.12 is the current portfolio support ceiling.
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tooling
        run: python -m pip install -e . pytest

      - name: Run tests (offline; no live CDFI Fund calls)
        # The suite is hermetic. The only socket it opens is a loopback
        # http.server in tests/test_loader.py, which stands up a local endpoint
        # to prove load_from_cdfi_fund_url() raises even on HTTP 200. No
        # outbound network, no `live` marker anywhere in tests/. Do not add one:
        # this package has no CDFI Fund ingestion path to test against.
        #
        # --import-mode=importlib is also set in pyproject addopts; passed here
        # explicitly as belt-and-suspenders. Without it pytest prepends the repo
        # root to sys.path and `import cdfifund` resolves to local source even
        # when a wheel is installed — CI would then test source while appearing
        # to test the wheel.
        run: python -m pytest --import-mode=importlib
