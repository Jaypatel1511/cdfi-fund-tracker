[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdfi-fund-tracker"
version = "0.1.0"
description = "CDFI Fund award tracker — CDFI Program, BEA, NACA, Native American, and CDFI Bond Guarantee Program awards with compliance status tracking"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/Jaypatel1511/cdfi-fund-tracker"
Repository = "https://github.com/Jaypatel1511/cdfi-fund-tracker"
