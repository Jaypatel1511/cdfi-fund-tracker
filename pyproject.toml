[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdfi-fund-tracker"
version = "0.2.0"
description = "CDFI Fund award analysis & compliance tracking — CDFI Program, BEA, NACA, Native American, RAPID, CMF, and Bond Guarantee awards. BRING YOUR OWN DATA: no CDFI Fund ingestion path is implemented; sample data is synthetic. See README."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://jaypatel1511.github.io/cdfi-superpowers/"
Repository = "https://github.com/Jaypatel1511/cdfi-fund-tracker"
Documentation = "https://github.com/Jaypatel1511/cdfi-fund-tracker#readme"
Issues = "https://github.com/Jaypatel1511/cdfi-fund-tracker/issues"
Changelog = "https://github.com/Jaypatel1511/cdfi-fund-tracker/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
# --import-mode=importlib is required, not cosmetic. Under the default "prepend"
# mode pytest puts the rootdir on sys.path, so `import cdfifund` resolves to
# ./cdfifund even when a built wheel is the thing under test — CI would report
# green for the wheel while actually exercising the source tree. The release
# workflow also passes this flag explicitly, because the wheel-test job runs the
# suite from a copied directory that does not contain this file.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
